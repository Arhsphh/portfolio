<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Investigation Portfolio Board</title>
  
  <!-- Εισαγωγή των αρχείων για το εφέ Google Maps (Leaflet) -->
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
    }
    
    .polaroid-frame {
      background: white;
      padding: 8px 8px 22px 8px;
      box-shadow: 3px 5px 15px rgba(0,0,0,0.6);
      border: 1px solid #ddd;
      cursor: pointer;
      width: 150px;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #333;
    }
    
    .photo-placeholder {
      width: 150px;
      height: 110px;
      background-color: #555;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 10px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // Ορισμός διαστάσεων καμβά
    var canvasH = 1600;
    var canvasW = 2500;

    // 1. Δημιουργία του καμβά με κεντραρισμένο Zoom
    var map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1,
      maxZoom: 1,
      zoom: 0,
      center: L.latLng(800, 1250), // Κεντράρισμα στη μέση του πίνακα
      zoomControl: true,
      scrollWheelZoom: 'center',
      doubleClickZoom: 'center',
      touchZoom: 'center'
    });

    // Ορισμός ορίων του φόντου
    var bounds = L.latLngBounds(L.latLng(0, 0), L.latLng(canvasH, canvasW));

    // 2. Δημιουργία του φόντου (Σκούρος καμβάς)
    L.rectangle(bounds, {
      color: "#3a2d28",
      weight: 1,
      fillColor: "#1e1512",
      fillOpacity: 1
    }).addTo(map);

    // Περιορισμός της κίνησης μέσα στα όρια του πίνακα
    map.setMaxBounds(bounds);

    // 3. ΣΥΝΑΡΤΗΣΗ ΓΙΑ ΤΙΣ ΦΩΤΟΓΡΑΦΙΕΣ
    function addEvidence(y, x, rotation, title, text) {
      var customIcon = L.divIcon({
        className: 'custom-pixel-node',
        html: '<div class="polaroid-frame" style="transform: rotate(' + rotation + 'deg);"><div class="photo-placeholder">ΦΩΤΟΓΡΑΦΙΑ</div><span>' + title + '</span></div>',
        iconSize: L.point(170, 200),
        iconAnchor: L.point(85, 100)
      });

      L.marker(L.latLng(y, x), {icon: customIcon}).addTo(map).bindPopup(
        '<div style="width:200px; font-family:monospace;"><h3>' + title + '</h3><p>' + text + '</p></div>'
      );
    }

    // ==========================================
    // ΤΟΠΟΘΕΤΗΣΗ ΦΩΤΟΓΡΑΦΙΩΝ
    // ==========================================
    addEvidence(900, 800, -5, 'ΠΕΙΣΤΗΡΙΟ 01', 'ISO 400 | f/2.8');
    addEvidence(700, 1600, 6, 'ΠΕΙΣΤΗΡΙΟ 02', 'ISO 100 | f/1.4');

  </script>
</body>
</html>
