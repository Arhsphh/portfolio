<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Investigation Portfolio Board</title>
  
  <!-- Εισαγωγή των αρχείων για το εφέ Google Maps (Leaflet) -->
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
    }
    
    /* Στυλ για τις φωτογραφίες-Polaroid πάνω στον πίνακα */
    .polaroid-frame {
      background: white;
      padding: 8px 8px 22px 8px;
      box-shadow: 3px 5px 15px rgba(0,0,0,0.6);
      border: 1px solid #ddd;
      cursor: pointer;
      width: 150px;
      text-align: center;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #333;
    }
    
    /* Γκρι κουτί αντί για εικόνα για να μην σπάει το link */
    .photo-placeholder {
      width: 150px;
      height: 110px;
      background-color: #555;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 10px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // Προστασία μεταβλητών από τα φίλτρα κειμένου
    var canvasH = parseInt("1600");
    var canvasW = parseInt("2500");
    
    var iconW = parseInt("170");
    var iconH = parseInt("200");
    var anchorW = parseInt("85");
    var anchorH = parseInt("100");

    // Ορισμός ορίων και του απόλυτου κέντρου του πίνακα
    var southWest = L.latLng(parseInt("0"), parseInt("0"));
    var northEast = L.latLng(canvasH, canvasW);
    var bounds = L.latLngBounds(southWest, northEast);
    var centerPoint = L.latLng(parseInt("800"), parseInt("1250")); // Το ακριβές γεωμετρικό κέντρο

    // 1. Δημιουργία του καμβά με ρυθμίσεις ΚΕΝΤΡΑΡΙΣΜΕΝΟΥ ZOOM
    var map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: parseInt("-1"),
      maxZoom: parseInt("1"),
      zoom: parseInt("0"),
      center: centerPoint, // Κλειδώνει την εκκίνηση στο κέντρο του πίνακα
      zoomControl: true,
      scrollWheelZoom: 'center', // Η ροδέλα ζουμάρει πάντα στο κέντρο
      doubleClickZoom: 'center', // Το διπλό κλικ ζουμάρει πάντα στο κέντρο
      touchZoom: 'center',       // Το pinch στην αφή ζουμάρει στο κέντρο
      maxBounds: bounds,         // Εμποδίζει τον χρήστη να συρθεί εκτός πίνακα
      maxBoundsViscosity: 1.0
    });

    // 2. Δημιουργία του φόντου με ψηφιακό σκούρο καφέ χρώμα
    var background = L.rectangle(bounds, {
      color: "#3a2d28",
      weight: parseInt("1"),
      fillColor: "#1e1512",
      fillOpacity: parseInt("1")
    }).addTo(map);

    // 3. ΣΥΝΑΡΤΗΣΗ ΓΙΑ ΝΑ ΒΑΖΕΙΣ ΦΩΤΟΓΡΑΦΙΕΣ (Πειστήρια)
    function addEvidence(y, x, rotation, title, text) {
      var sizePoint = L.point(iconW, iconH);
      var anchorPoint = L.point(anchorW, anchorH);

      var customIcon = L.divIcon({
        className: 'custom-pixel-node',
        html: `<div class="polaroid-frame" style="transform: rotate(${rotation}deg);">
                 <div class="photo-placeholder">ΦΩΤΟΓΡΑΦΙΑ</div>
                 <span>${title}</span>
               </div>`,
        iconSize: sizePoint,
        iconAnchor: anchorPoint
      });

      var markerPos = L.latLng(y, x);
      L.marker(markerPos, {icon: customIcon}).addTo(map).bindPopup(`
        <div style="width:200px; font-family:monospace;">
          <h3>${title}</h3>
          <p>${text}</p>
        </div>
      `);
    }

    // ==========================================
    // ΕΔΩ ΜΠΑΙΝΟΥΝ ΟΙ ΦΩΤΟΓΡΑΦΙΕΣ ΚΑΙ ΤΑ ΣΚΟΙΝΙΑ
    // ==========================================
    
    // Φωτογραφία 1 (Ύψος: 900, Πλάτος: 800)
    addEvidence(parseInt("900"), parseInt("800"), parseInt("-5"), 'ΠΕΙΣΤΗΡΙΟ 01', 'ISO 400 | f/2.8');

    // Φωτογραφία 2 (Ύψος: 700, Πλάτος: 1600)
    addEvidence(parseInt("700"), parseInt("1600"), parseInt("6"), 'ΠΕΙΣΤΗΡΙΟ 02', 'ISO 100 | f/1.4');

    // Σχεδίαση Σκοινιού ανάμεσα στα δύο σημεία
    var pointA = L.latLng(parseInt("900"), parseInt("800"));
    var pointB = L.latLng(parseInt("700"), parseInt("1600"));
    
    L.polyline([pointA, pointB], {
      color: '#cc0000', 
      weight: parseInt("4"),
      opacity: 0.9
    }).addTo(map);

  </script>
</body>
</html>
