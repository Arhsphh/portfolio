<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
  <title>Investigation Portfolio Board</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      overflow: hidden;
      user-select: none;
    }

    /* Το πλαίσιο της οθόνης */
    #viewport {
      width: 100%;
      height: 100%;
      position: relative;
      cursor: grab;
    }
    #viewport:active {
      cursor: grabbing;
    }

    /* Ο μεγάλος πίνακας (Καμβάς) - Με εφέ σκούρου ξύλου/φελλου */
    #board {
      width: 2400px;
      height: 1600px;
      background: radial-gradient(circle, #3a2d28 0%, #1e1512 100%);
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    }

    /* Στυλ για τις φωτογραφίες Polaroid */
    .polaroid {
      background: white;
      padding: 10px 10px 25px 10px;
      box-shadow: 5px 8px 20px rgba(0,0,0,0.6);
      border: 1px solid #ddd;
      position: absolute;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: bold;
      color: #333;
      text-align: center;
      width: 180px;
    }
    
    /* Γκρι εσωτερικό κουτί για τις φωτογραφίες */
    .photo-placeholder {
      width: 180px;
      height: 130px;
      background-color: #555;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 10px;
    }

    /* Το επίπεδο για τα κόκκινα σκοινιά */
    svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Κουμπιά ελέγχου Zoom - Σταθερά στην οθόνη */
    .zoom-controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10000;
    }
    .zoom-btn {
      width: 50px;
      height: 50px;
      background-color: #ffffff;
      border: 2px solid #333;
      border-radius: 50%;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-btn:active {
      background-color: #ddd;
    }
  </style>
</head>
<body>

  <!-- Κουμπιά Zoom με απευθείας εντολές HTML κλικ -->
  <div class="zoom-controls">
    <button class="zoom-btn" id="btn-in">+</button>
    <button class="zoom-btn" id="btn-out">-</button>
  </div>

  <div id="viewport">
    <div id="board">
      
      <!-- Κόκκινο Σκοινί -->
      <svg>
        <line x1="490" y1="410" x2="1290" y2="610" style="stroke:#cc0000; stroke-width:4; stroke-opacity:0.9; stroke-linecap:round;" />
      </svg>

      <!-- ΦΩΤΟΓΡΑΦΙΑ 1 -->
      <div class="polaroid" style="left: 400px; top: 300px; transform: rotate(-5deg);" onclick="alert('ΥΠΟΘΕΣΗ #01\nISO 400 | f/2.8');">
        <div class="photo-placeholder">ΦΩΤΟΓΡΑΦΙΑ Α</div>
        <span>ΠΕΙΣΤΗΡΙΟ 01</span>
      </div>

      <!-- ΦΩΤΟΓΡΑΦΙΑ 2 -->
      <div class="polaroid" style="left: 1200px; top: 500px; transform: rotate(6deg);" onclick="alert('ΥΠΟΘΕΣΗ #02\nISO 100 | f/1.4');">
        <div class="photo-placeholder">ΦΩΤΟΓΡΑΦΙΑ Β</div>
        <span>ΠΕΙΣΤΗΡΙΟ 02</span>
      </div>

    </div>
  </div>

  <script>
    var viewport = document.getElementById('viewport');
    var board = document.getElementById('board');
    var btnIn = document.getElementById('btn-in');
    var btnOut = document.getElementById('btn-out');

    // Αρχικές τιμές θέσης και μεγέθους
    var scale = 0.8; 
    var posX = 100;   
    var posY = 50;    
    var isDragging = false;
    var startX = 0;
    var startY = 0;

    function updateTransform() {
      board.style.transform = "translate(" + posX + "px, " + posY + "px) scale(" + scale + ")";
    }
    updateTransform();

    // 1. ΛΕΙΤΟΥΡΓΙΑ DRAG (ΣΥΡΣΙΜΟ)
    viewport.addEventListener('pointerdown', function(e) {
      if (e.target.closest('.polaroid') || e.target.closest('.zoom-controls')) return; 
      isDragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
      viewport.setPointerCapture(e.pointerId);
    });

    viewport.addEventListener('pointermove', function(e) {
      if (!isDragging) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      updateTransform();
    });

    viewport.addEventListener('pointerup', function(e) {
      isDragging = false;
      viewport.releasePointerCapture(e.pointerId);
    });

    // 2. ΛΕΙΤΟΥΡΓΙΑ ΚΟΥΜΠΙΩΝ ZOOM (Σταθερή Σύνδεση Event)
    btnIn.addEventListener('click', function() {
      if (scale < 2.5) {
        scale = scale + 0.2;
        updateTransform();
      }
    });

    btnOut.addEventListener('click', function() {
      if (scale > 0.3) {
        scale = scale - 0.2;
        updateTransform();
      }
    });

    // 3. ZOOM ΜΕ ΡΟΔΕΛΑ ΠΟΝΤΙΚΙΟΥ (Για PC)
    viewport.addEventListener('wheel', function(e) {
      e.preventDefault();
      if (e.deltaY < 0) {
        if (scale < 2.5) scale = scale + 0.1;
      } else {
        if (scale > 0.3) scale = scale - 0.1;
      }
      updateTransform();
    }, { passive: false });
  </script>

</body>
</html>
